# The changed lines no changed declaration and no import accounts for, as
# the Declarations tab shows them: in runs, each with what it is. `input` is
# the file before and after; `output` lists the runs in the order the tab
# shows them, among the declarations that changed:
#
#   "declaration <label>"                          a declaration shown
#   "<kind> <from>-<to> +<added> −<removed> [names]"  a run (its lines in the new file, else in the old)

name = "changes outside the declarations"

[[tests]]
name = "a file's header comment, apart from the code by a blank line"
input.before = """
// The receipt is bound to the phone number.

export const a = 1;
"""
input.after = """
// The receipt is bound to the phone number,
// and to the code that send issued.

export const a = 2;
"""
output = ["comment 1-2 +2 −1", "declaration a"]

[[tests]]
name = "a comment right above a declaration is part of it, not outside"
input.before = """
/** Adds. */
export const add = (a: number, b: number) => a + b;
"""
input.after = """
/** Adds two numbers. */
export const add = (a: number, b: number) => a + b;
"""
output = ["declaration add"]

[[tests]]
name = "a blank line added between declarations isn't shown"
input.before = """
const a = 1;
const b = 2;
const c = 3;
"""
input.after = """
const a = 1;

const b = 20;
const c = 3;
"""
output = ["declaration b"]

[[tests]]
name = "a blank line removed inside a comment doesn't split it"
input.before = """
// one

// two

export const a = 1;
"""
input.after = """
// one, changed
// two, changed

export const a = 1;
"""
output = ["comment 1-2 +2 −2"]

[[tests]]
name = "a declaration whose only change is blank lines isn't shown, nor are its blank lines"
input.before = """
function f() {
  const a = 1;
  return a;
}
"""
input.after = """
function f() {
  const a = 1;


  return a;
}
"""
output = []

[[tests]]
name = "the same declaration, moved"
input.before = """
function first() {
  return 1;
}
function second() {
  return 2;
}
"""
input.after = """
function second() {
  return 2;
}
function first() {
  return 1;
}
"""
# git keeps `second` in place and moves `first`: out at old lines 1-3, in at new lines 4-6.
output = ["moved 1-3 +0 −3 first", "moved 4-6 +3 −0 first"]
