<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@dral/pan-zoom demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      #root {
        display: grid;
        gap: 12px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .controls label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      /* A thick border, so a zoom that forgets it turns around the wrong point. */
      .viewport {
        border: 6px solid #8886;
        border-radius: 6px;
        background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0 / 24px 24px;
        cursor: grab;
        user-select: none;
      }
      .viewport:focus-visible {
        outline: 3px solid #36f;
      }
      .drawing {
        position: relative;
        outline: 2px dashed #8886;
      }
      .card {
        position: absolute;
        width: 160px;
        height: 90px;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #8888;
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
        text-decoration: none;
      }
      .card[data-shown] {
        outline: 3px solid #e60;
      }
      .readouts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        font: 12px ui-monospace, monospace;
      }
      .log {
        max-height: 160px;
        overflow: auto;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo.tsx"></script>
  </body>
</html>
